<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="554" viewBox="0 0 1040 554" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img">
<title>The contribution folder, nordbean_irrigation_2025, one folder per contribution, named after it. raw_data is yours, with your data and documents, read-only, and in it notes, with your answers, one file per subject. phenotheca is a copy of this repository, which nobody edits. runs is where the AI writes, one run per handover. In 2026-10-22 are conversion.py, the script from raw_data to tables, conversion-notes.md, with what was changed and what is missing, summary.md, with what the tables hold, for you to check, review.md, the review with the FAIR score, and tables, with the tables and who to credit, written by the script alone.</title>
