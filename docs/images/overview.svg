<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="604" viewBox="0 0 1360 604" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" role="img">
<title>On the contributor's computer, the data is converted into the format and curated. The contributor answers and has the last word, an AI asks and writes the script, and a fresh AI or a colleague reviews, while the raw files stay there. The tables and the credit go to the data manager's folder, where the contributions are merged and their overlaps handled. The data manager decides every change, and an AI proposes the merge. The tables, the credit and the README go to Zenodo, into the public dataset or a project's restricted one, which Zenodo shares and stores for the long term, and where data users download and cite them. The IDs already published are reused, so that one thing has one ID across datasets.</title>
