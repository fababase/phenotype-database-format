# Machine-readable copy of the phenotype database schema. schema.md describes it in full.
# The validator (app/validation.py) reads this file, so a change here changes what it checks. The collection sheet,
# the diagram and the tables in schema.md that list the tables and columns are made from it too. An Action writes
# the tables in schema.md, with schema/schema_md.py, on every push to main.

version: "1.0.0"

# Cell values that mean "no value", besides an empty cell. Compared ignoring case and surrounding spaces.
missing_values: ["NULL", "NA", "N/A", "None", "Not applicable"]

# Column types:
#   id           identifies a row: only the letters A-Z and a-z, the digits 0-9 and _
#   text         short text
#   long_text    free text of any length
#   integer      whole number
#   number       real number, with "." as the decimal mark
#   date         YYYY-MM-DD
#   coordinates  latitude;longitude in decimal degrees, without spaces
#   features     FTID1=value1;FTID2=value2, with FTIDs from the Features table
#
# Each table's first column is its ID column. Columns are optional and not unique unless marked.
# Unique IDs are compared ignoring case, so hedin_2 and Hedin_2 count as the same ID.
# A table marked required must be present with at least one row; the others may be left out.
#
# Each table has:
#   one_row_is   what one row of the table is
#   filled_in    when the table is filled in, relative to the experiment
#   needed       when an optional table is needed; a required table is needed always
# and each column has a description, which may have `code` and **bold** in it, and optionally an example.
# They are shown in schema.md and in row 2 of the collection sheet.

tables:
  Germplasm:
    code: GP
    required: true
    one_row_is: a variety, line or other genetically distinct plant material
    filled_in: before
    columns:
      GPID:
        type: id
        required: true
        unique: true
        description: Germplasm ID.
        example: vandrel
      Name:
        type: text
        description: Name of the variety or line.
        example: Vandrel
      AlternativeName:
        type: text
        description: Other names for the variety. Separate several names with `;`.
        example: NB 117
      Species:
        type: text
        description: Species of the variety.
        example: Vicia faba
      Donor:
        type: text
        description: Donor or parent of the variety.
        example: Nordbean breeding programme
      GeographicOrigin:
        type: text
        description: Geographic origin of the variety.
        example: Denmark
      Maintaining:
        type: text
        description: Who maintains the variety, such as a breeder or genebank.
        example: Nordbean breeding programme
      Comments:
        type: long_text
        description: What is known about the material that no column holds, such as its pedigree, breeding
          history or notable traits.
        example: Small-seeded field bean line selected for early flowering. The seeds are round and buff coloured.

  SeedLot:
    code: SL
    required: true
    one_row_is: a batch of seed of one germplasm
    filled_in: before
    columns:
      SLID:
        type: id
        required: true
        unique: true
        description: Seed lot ID.
        example: vandrel_northfield_2024
      GPID:
        type: id
        required: true
        links_to: Germplasm
        description: Germplasm the seed is of.
        example: vandrel
      HarvestDate:
        type: date
        description: Date the seed lot was harvested.
        example: "2024-08-29"
      HarvestLocation:
        type: text
        description: Where the seed lot was harvested.
        example: Northfield research farm
      ParentSLID:
        type: id
        links_to: SeedLot
        description: Seed lot this one was grown from.
        example: vandrel_northfield_2023
      Comments:
        type: long_text
        description: Seed quality and handling, such as germination, seed treatment or deviations from expected
          phenotype.
        example: Germination 91 percent in a test in February 2025.

  Experiment:
    code: EXP
    required: true
    one_row_is: a trial or experiment
    filled_in: before
    columns:
      EXPID:
        type: id
        required: true
        unique: true
        description: Experiment ID.
        example: nordbean_irrigation_northfield_2025
      GPSCoordinates:
        type: coordinates
        description: Location of the experiment.
        example: 56.091250;9.552040
      PlotSize:
        type: text
        description: Size of each plot or pot, with its unit.
        example: 15 square metres
      PlotSizeIncludingPath:
        type: text
        description: Size of each plot, including paths, with its unit.
        example: 18 square metres
      StartDate:
        type: date
        description: Start of the growing period.
        example: "2025-04-08"
      EndDate:
        type: date
        description: End of the growing period.
        example: "2025-08-26"
      Description:
        type: long_text
        description: The site (address and field) or facility, growing conditions, trial size, plot layout,
          design and number of replicates, what the blocks are, any irrigation, which traits were tested, which
          factors are tested, and any other information relevant to this experiment. The levels of the factors
          are defined in ExperimentIntervention.
      Manager:
        type: text
        description: Name of the person who managed the trial.
        example: Rhea Plicate
      Distance:
        type: text
        description: Distance to the weather station that the Climate data comes from, with its unit.
        example: 1.2 km
      Comments:
        type: long_text
        description: Events that affected the whole experiment.
        example: A hailstorm on 2025-06-14 damaged leaves and flowers across the whole field.

  ExperimentalUnit:
    code: UN
    required: true
    one_row_is: "a unit in an experiment: a field plot, a pot, a sample, …"
    filled_in: before
    columns:
      UNID:
        type: id
        required: true
        unique: true
        description: Unit ID.
        example: nordbean_irrigation_northfield_2025_plot101
      EXPID:
        type: id
        required: true
        links_to: Experiment
        description: Experiment the unit belongs to.
        example: nordbean_irrigation_northfield_2025
      SLID:
        type: id
        required: true
        links_to: SeedLot
        description: Seed lot the plants in the unit come from.
        example: vandrel_northfield_2024
      GPSCoordinates:
        type: coordinates
        description: Location of the unit.
        example: 56.091200;9.552000
      Features:
        type: features
        description: Features of the whole unit.
        example: soil_type=sandy loam;soil_ph=6.4
      Block:
        type: integer
        description: Block or batch the unit belongs to.
        example: "1"
      Column:
        type: integer
        description: Column the unit is in.
        example: "1"
      Row:
        type: integer
        description: Row the unit is in.
        example: "1"
      Comments:
        type: long_text
        description: Something that happened to this unit.
        example: "Poor emergence: about 22 plants per square metre, against about 40 in the other plots."

  ExperimentIntervention:
    code: I
    one_row_is: the intervention level of one unit
    filled_in: before
    needed: in experiments with interventions
    columns:
      IID:
        type: id
        required: true
        unique: true
        description: Intervention ID.
        example: nordbean_irrigation_northfield_2025_001
      UNID:
        type: id
        required: true
        unique: true
        links_to: ExperimentalUnit
        description: Unit that received the intervention.
        example: nordbean_irrigation_northfield_2025_plot101
      Intervention:
        type: text
        required: true
        description: Level the unit received. With several factors, the combination of levels, such as
          `HighWaterInoculated`.
        example: HighWater
      Description:
        type: long_text
        required: true
        description: "The intervention system in the experiment, with every level defined concretely: what was
          done, how much and when. Also which level is the control, if there is one."

  Management:
    code: MM
    one_row_is: a treatment given to a whole experiment
    filled_in: during or after
    needed: if recorded
    columns:
      MMID:
        type: id
        required: true
        unique: true
        description: Management ID.
        example: nordbean_irrigation_northfield_2025_001
      EXPID:
        type: id
        required: true
        links_to: Experiment
        description: Experiment that received the treatment.
        example: nordbean_irrigation_northfield_2025
      Treatment:
        type: text
        description: Treatment the plants got.
        example: Fertiliser
      Description:
        type: long_text
        description: The product or active ingredient, how it was applied, and why. The concentration and amount
          go in Dosage.
        example: Phosphorus and potassium fertiliser, spread over the whole field and harrowed in before sowing. No nitrogen was given, as the crop fixes its own.
      Dosage:
        type: text
        description: Dosage of the treatment, with its unit.
        example: 300 kg phosphorus and 150 kg potassium per hectare
      Date:
        type: date
        description: Date of the treatment.
        example: "2025-04-03"
      Comments:
        type: long_text
        description: Deviations from the plan.
        example: The eastern half of the field was sprayed a day later, on 2025-04-11, because of wind.

  PhenotypeDescription:
    code: PD
    required: true
    one_row_is: "a trait: what is measured, in which unit and how"
    filled_in: before
    columns:
      PDID:
        type: id
        required: true
        unique: true
        description: Phenotype description ID.
        example: plant_height_mean_of_5_plants_cm
      PhenotypeDescription:
        type: text
        required: true
        description: Name of the trait.
        example: Plant height
      Unit:
        type: text
        required: true
        description: Unit the trait is scored in.
        example: cm
      Grouping:
        type: text
        description: "Trait class the trait belongs to, from Crop Ontology: Morphological, Phenological,
          Agronomical, Physiological, Abiotic stress, Biotic stress, Biochemical, Quality or Fertility."
        example: Morphological
      DescriptionOfMethod:
        type: long_text
        required: true
        description: What is measured, on which part of the plant, at which growth stage, with what, on how many
          plants and how they are chosen, how the score is calculated, and what every code means.

  Phenotype:
    code: PH
    required: true
    one_row_is: one score of one trait on one unit
    filled_in: during or after
    columns:
      PHID:
        type: id
        required: true
        unique: true
        description: Phenotype ID.
        example: nordbean_irrigation_northfield_2025_000001
      UNID:
        type: id
        required: true
        links_to: ExperimentalUnit
        description: Unit that was scored.
        example: nordbean_irrigation_northfield_2025_plot101
      PDID:
        type: id
        required: true
        links_to: PhenotypeDescription
        description: Trait that was scored.
        example: plant_height_mean_of_5_plants_cm
      Features:
        type: features
        description: Features of this score.
        example: wavelength=1450;tissue=young leaf
      Date:
        type: date
        description: Date of scoring.
        example: "2025-06-30"
      Score:
        type: number
        required: true
        description: The score.
        example: "94"
      ScoredBy:
        type: text
        description: Name of the person who did the scoring.
        example: Rhea Plicate
      Comments:
        type: long_text
        description: Something about this one value that a reader should know.
        example: Scored three days after the other plots, as rain stopped the scoring.

  ClimateDescription:
    code: CD
    one_row_is: "a climate variable: what is measured, in which unit and how"
    filled_in: before
    needed: with Climate
    columns:
      CDID:
        type: id
        required: true
        unique: true
        description: Climate description ID.
        example: air_temperature_daily_mean_2m_c
      Name:
        type: text
        required: true
        description: Name of the climate variable.
        example: Mean air temperature at 2 m
      Unit:
        type: text
        required: true
        description: Unit the variable is measured in.
        example: degrees Celsius
      Grouping:
        type: text
        description: Group the variable belongs to.
        example: Temperature
      DescriptionOfMethod:
        type: long_text
        required: true
        description: What is measured, at which height or depth, how often it is read, how the value is
          calculated, and what every code means.
        example: Air temperature measured 2 m above the ground in a ventilated radiation shield, read every 10 minutes. The value is the mean of the readings from 00:00 to 24:00 local time.

  Climate:
    code: CL
    one_row_is: one climate measurement
    filled_in: during or after
    needed: if recorded
    columns:
      CLID:
        type: id
        required: true
        unique: true
        description: Climate ID.
        example: nordbean_irrigation_northfield_2025_003
      EXPID:
        type: id
        required: true
        links_to: Experiment
        description: Experiment the measurement belongs to.
        example: nordbean_irrigation_northfield_2025
      UNID:
        type: id
        links_to: ExperimentalUnit
        description: Unit the measurement belongs to. **Empty or missing means all units in the experiment.**
        example: nordbean_irrigation_northfield_2025_plot101
      CDID:
        type: id
        required: true
        links_to: ClimateDescription
        description: Climate variable that was measured.
        example: soil_water_content_20cm_percent
      Date:
        type: date
        description: Date of the measurement.
        example: "2025-06-10"
      Score:
        type: number
        required: true
        description: The measured value.
        example: "27.8"
      Comments:
        type: long_text
        description: Something about this one value that a reader should know.
        example: Includes the hail that fell in the afternoon, measured as melted water.

  Features:
    code: FT
    one_row_is: a kind of extra annotation
    filled_in: before, during or after
    needed: if needed
    columns:
      FTID:
        type: id
        required: true
        unique: true
        description: Feature ID, used as the key in Features cells.
        example: soil_type
      Type:
        type: text
        description: "Kind of value, in lower case: `c` for text, `i` for whole numbers, `d` for real numbers.
          Empty means `c`."
        example: c
      Unit:
        type: text
        description: Unit of the values, mostly for numbers.
        example: nm
      Vocabulary:
        type: text
        description: "Allowed values: a `;`-separated list for `c`, or a `min..max` range for `i` and `d`."
        example: clay;loam;sandy loam
      Description:
        type: long_text
        required: true
        description: What the feature is and what its values mean.
        example: Texture class of the topsoil, from a soil map.

# Rules that span tables, checked after the links. Each name is implemented in the validator.
rules:
  - climate_unit_in_experiment  # a Climate UNID that is filled in belongs to the row's EXPID
  - one_intervention_per_unit   # in experiments with interventions, every unit has a row in ExperimentIntervention
  - every_experiment_has_a_unit # every experiment has at least one unit
