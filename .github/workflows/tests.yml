# Runs the tests on every push and pull request. Can also be started by hand from the Actions tab.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt

      # The app's pinned packages, so the tests run against the versions the app uses
      - name: Install packages
        run: pip install -r app/requirements.txt -r tests/requirements.txt

      - name: Run tests
        run: pytest tests
