# Runs the tests on every push and pull request. Can also be started by hand from the Actions tab.
# The deploy workflow runs them too, before it publishes the app.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The whole history, as a test reads every version of the schema in it
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            tests/requirements.txt

      # The app's pinned packages, so the tests run against the versions the app uses
      - name: Install packages
        run: pip install -r app/requirements.txt -r tests/requirements.txt

      # R, and the packages that the R code in the Quick start of publishing/README_TEMPLATE.md uses, which a test
      # runs. The test fails rather than being skipped when R is not there on GitHub. use-public-rspm gets the
      # packages ready built for Linux, so they install in seconds.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("readr", "dplyr", "tidyr"))'

      - name: Run tests
        run: pytest tests
